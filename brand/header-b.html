<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:3000px;height:1000px;background:#F3EFE6;overflow:hidden}
  .wrap{position:relative;width:3000px;height:1000px;color:#141210;font-family:"Noto Serif SC",serif}
  .line{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;font-weight:900;font-size:300px;letter-spacing:0.08em;line-height:1}
  .line em{font-style:normal;color:#C3301C}
  .tag{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:34px;letter-spacing:0.5em;color:#7b7466}
  .seal{position:absolute;left:150px;top:120px;width:120px;height:120px;background:#C3301C}
  .seal i{position:absolute;inset:8px;border:3px solid #F3EFE6}
  .seal b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:74px;color:#F3EFE6;transform:translateY(2px)}
  .word{position:absolute;left:300px;top:128px;font-weight:900;font-size:84px;line-height:1.3}
  .hair{position:absolute;left:150px;right:150px;bottom:100px;height:3px;background:#141210}
</style></head>
<body><div class="wrap">
  <div class="seal"><i></i><b>衍</b></div><div class="word">衍算</div>
  <div class="line">算力为<em>凭</em>。</div>
  <div class="hair"></div>
  <div class="tag">PROOF OF INFERENCE · BNB CHAIN</div>
</div></body></html>
